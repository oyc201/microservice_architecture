openapi: 3.0.3
info:
  title: LoL Match Insights - Batch Telemetry API
  version: "1.0.0"
paths:
  /lol/player-snapshots:
    # post:
    #   summary: Receives a batch of player performance snapshots
    #   operationId: app.receive_player_snapshot #corresponds to the module name and function name 
    #   description: Adds a batch of player snapshots for a match.
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           $ref: '#/components/schemas/PlayerSnapshot'
    #   responses:
    #     '201':
    #       description: Batch successfully received
    #     '400':
    #       description: Invalid input
    get:
      summary: Get player snapshots within a time range
      operationId: app.get_player_snapshots
      parameters:
        - name: start_timestamp
          in: query
          required: true
          schema:
            format: date-time
            type: string
        - name: end_timestamp
          in: query
          required: true
          schema:
            format: date-time
            type: string
      responses:
        '200':
          description: List of player snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerSnapshot'

  /lol/match-events:
    # post:
    #   summary: Receives a batch of match timeline events (objectives, kills, towers)
    #   operationId: app.receive_match_event
    #   description: Adds a batch of match events for a match.
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           $ref: '#/components/schemas/MatchEvent'
    #   responses:
    #     '201':
    #       description: Batch successfully received
    #     '400':
    #       description: Invalid input
    get:
      summary: Get match events within a time range
      operationId: app.get_match_events
      parameters:
        - name: start_timestamp
          in: query
          required: true
          schema:
            format: date-time
            type: string
        - name: end_timestamp
          in: query
          required: true
          schema:
            format: date-time
            type: string
      responses:
        '200':
          description: List of match events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchEvent'

components:
  schemas:
    PlayerSnapshot:
      type: object
      required: [trace_id, match_id, player_puuid, game_time_seconds, kills, deaths, assists, cs, gold, lane]
      properties:
        trace_id:
          type: string
          example: "1345ab-67889dc-21345ef-0987654"
        match_id:
          type: string
          example: "NA1_1234567890"
        player_puuid:
          type: string
          example: "abcdefg-puuid-123"
        game_time_seconds:
          type: integer
          example: 615
        kills:
          type: integer
          example: 3
        deaths:
          type: integer
          example: 1
        assists:
          type: integer
          example: 4
        cs:
          type: integer
          example: 72
        gold:
          type: integer
          example: 4200
        lane:
          type: string
          enum: [TOP, JUNGLE, MID, BOT, SUPPORT]

    MatchEvent:
      type: object
      required: [trace_id, match_id, event_type, game_time_seconds, team_id, x, y]
      properties:
        trace_id:
          type: string
          example: "1345ab-67889dc-21345ef-0987654gh"
        match_id:
          type: string
          example: "NA1_1234567890"
        event_type:
          type: string
          enum: [DRAGON, BARON, HERALD, TOWER, KILL, INHIBITOR]
        game_time_seconds:
          type: integer
          example: 1320
        team_id:
          type: integer
          enum: [100, 200]
        x:
          type: number
          example: 102.5
        y:
          type: number
          example: 88.2
        killer_puuid:
          type: string
          nullable: true
          example: "abcdefg-puuid-123"

          