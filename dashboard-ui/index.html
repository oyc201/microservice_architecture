<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ACIT3855 statistics application" />
    <script src="updateStats.js"></script>
    <title>ACIT3855 - LoL Match Insights</title>
</head>
 
<body>
    <main id="main">
        <div id="header">
            <h1>LoL Match Insights Dashboard</h1>
        </div>
        <h5 id="last-updated">Last update: <span id="last-updated-value">N/A</span></h5>
        <div id="messages"></div>
        <h2>Statistics</h2>
        <div id="statistics">
            <div class="stat-box">
                <h3>Processing Stats</h3>
                <div id="processing-stats"></div>
            </div>
            <div class="stat-box">
                <h3>Analyzer Stats</h3>
                <div id="analyzer-stats"></div>
            </div>
        </div>
        <h2>Analyzer Events</h2>
        <div id="events">
            <div class="event-box">
                <h3>Player Snapshot</h3>
                <div id="event-player-snapshot"></div>
            </div>
            <div class="event-box">
                <h3>Match Event</h3>
                <div id="event-match-event"></div>
            </div>
        </div>
    </main>
</body>
 
</html>
