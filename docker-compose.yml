services:
  dashboard:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - processor
      - analyzer

  receiver:
    build:
      context: ./Receiver
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    command: >
      sh -c "/wait.sh kafka 9092 &&
              python app.py"
    volumes:
      - ./config:/config
      - ./logs:/logs

  storage:
    build:
      context: ./Storage
      dockerfile: Dockerfile
    depends_on:
      - db
      - kafka
    command: >
      sh -c "/wait.sh db 3306 &&
             /wait.sh kafka 9092 &&
              python app.py"
    volumes:
      - ./config:/config
      - ./logs:/logs

  processor:
    build:
      context: ./Processor
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    depends_on:
      - storage
    command: >
      sh -c "/wait.sh storage 8090 &&
              python app.py"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./data/processing:/data

  analyzer:
    build:
      context: ./Analyzer
      dockerfile: Dockerfile
    ports:
      - "8110:8110"
    depends_on:
      - kafka
    command: >
      sh -c "/wait.sh kafka 9092 &&
              python app.py"
    volumes:
      - ./config:/config
      - ./logs:/logs

  zookeeper:
     image: wurstmeister/zookeeper
     volumes:
      - zookeeper-data:/opt/zookeeper-3.4.13/data

  kafka:
    image: wurstmeister/kafka
    command: [start-kafka.sh]
    ports:
      - "9092:9092"
    environment:
      KAFKA_CREATE_TOPICS: "events:1:1" # topic:partition:replicas
      KAFKA_ADVERTISED_HOST_NAME: localhost # docker-machine ip
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: '/kafka/logs'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kafka-data:/kafka/logs
    depends_on:
      - "zookeeper"

  db:
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
      MYSQL_USER: acit3855
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: acit3855_project
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
  kafka-data:
  zookeeper-data: